<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/img/IV.ico">
    <title>IV Congresso de Tecnologia da Informação - IFSul</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/common/header.css">
    <link rel="stylesheet" href="../../assets/css/arenagames/arenagames.css">
    <link rel="stylesheet" href="../../assets/css/common/footer.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <script>
        fetch('/Site_IFSul/src/header/index.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                ajustarNavbar();
            });

        function ajustarNavbar() {
            let path = window.location.pathname;
            let isHome = path.includes("/home/index.html") || path.endsWith("/home/");

            let navLinks = document.querySelector(".navbar-nav");

            if (!isHome) {
                let homeLink = navLinks.querySelector("a[href='#home']");
                if (homeLink) homeLink.setAttribute("href", "/src/home/index.html");

                let scheduleLink = navLinks.querySelector("a[href='#programacao']");
                if (scheduleLink) scheduleLink.setAttribute("href", "/src/programacao/index.html");

                let contatoLink = navLinks.querySelector("a[href='#contato']");
                if (contatoLink) contatoLink.closest("li").remove();

                let arenaLink = navLinks.querySelector("a[href='#arena']");
                if (arenaLink) arenaLink.setAttribute("href", "../arenagame/index.html");
            }
        }
    </script>
    <main>
        <section id="time" class="py-5 bg-light" style="margin-top: 50px;">
            <div class="container" >
                <h2 class="section-title">Horários matriz 2023</h2>
                <div class="row g-4" style="margin-top: 10px;">
                    <iframe src="https://painel.passofundo.ifsul.edu.br/iframes/horarios.php?curso=BCC_2023&mostra_professor="
                        title="Horários BCC 2017" loading="lazy" allowfullscreen
                        style="width: 100%; height: 650px; border: none;"></iframe>
                    </iframe>
                </div>
            </div>
        </section>

        <section id="time" class="py-5 bg-light">
            <div class="container">
                <h2 class="section-title">Horários matriz 2017</h2>
                <div class="row g-4" style="margin-top: 10px;">
                    <iframe src="https://painel.passofundo.ifsul.edu.br/iframes/horarios.php?curso=BCC_2017"
                        title="Horários BCC 2017" loading="lazy" allowfullscreen
                        style="width: 100%; height: 650px; border: none;"></iframe>
                    </iframe>
                </div>
            </div>
        </section>


        <div id="footer-placeholder"></div>
        <script>
            fetch('../footer/index.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-placeholder').innerHTML = data;
                });
        </script>

    </main>
    <script src="../interactive-bubble.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
</body>

</html>
